; PlatformIO Project Configuration File
;
; Dois ambientes configurados no mesmo projeto:
;   1. sender_mpu6050 -> ESP32 Emissor (conectado ao sensor MPU6050 via I2C)
;   2. receiver_usb   -> ESP32 Receptor (conectado via USB ao PC)
;
; Comandos rápidos:
;   Gravar Emissor:   pio run -e sender_mpu6050 -t upload
;   Gravar Receptor:  pio run -e receiver_usb -t upload

[platformio]
src_dir = firmware
default_envs = sender_mpu6050, receiver_usb

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[env:sender_mpu6050]
upload_port = COM5
build_src_filter = -<*> +<sender_mpu6050/*>
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BusIO @ ^1.16.1

[env:receiver_usb]
upload_port = COM6
build_src_filter = -<*> +<receiver_usb/*>
